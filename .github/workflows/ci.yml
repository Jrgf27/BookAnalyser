name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        # requirements-dev.txt pulls in requirements.txt plus pytest.
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # Tests are self-contained (SQLite + stubbed Azure calls), so no secrets
        # are needed. Dummy env vars satisfy the required settings at import time.
        env:
          PYTHONPATH: .
          AZURE_OPENAI_ENDPOINT: https://example.invalid/
          AZURE_OPENAI_API_KEY: test-key
        run: python -m pytest -q

  frontend:
    name: Frontend (build + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Run tests
        run: npm test
