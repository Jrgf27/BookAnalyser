services:
  backend:
    build: ./backend
    # Not published to the host: the frontend reaches the backend over the
    # Compose network by service name (see frontend/nginx.conf → http://backend:8000),
    # and the browser only ever talks to the frontend origin. `expose` is
    # documentation only — Compose networking already allows inter-service traffic
    # on any port. To hit the API directly from the host for debugging, add a
    # `ports: ["8000:8000"]` mapping (or use `docker compose port backend 8000`).
    expose:
      - "8000"
    env_file: .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Don't count failures while the app is still booting (imports, DB open,
      # first-run warmup); the container stays "starting" until this elapses.
      start_period: 60s

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
