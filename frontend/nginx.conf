server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Allow large uploads (HTML books and restored .db snapshots with
    # embeddings can be tens/hundreds of MB); 0 disables the size cap.
    client_max_body_size 0;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Don't buffer the whole upload before forwarding — stream it to the
        # backend so large restores don't fail or hang.
        proxy_request_buffering off;

        # Server-Sent Events (/api/chat/stream): stream tokens through without
        # buffering or timing out mid-answer.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
